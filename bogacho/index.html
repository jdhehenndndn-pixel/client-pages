<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">

<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&family=Cormorant+Garamond:ital,wght@1,600&display=swap" rel="stylesheet">
<style>
:root{--cream:#f3f0e7;--paper:#fffdf8;--ink:#14241b;--soft:#56655b;--leaf:#2d7b4e;--lime:#c3ef6b;--night:#0f1f17;--line:#d9d3c2;--red:#b3362a;--redbg:#f9e5e0;--am:#8a5d0c;--ambg:#f7edd3;--gr:#226840;--grbg:#e3f0df}
*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;min-height:100vh;background:var(--cream);color:var(--ink);font:18px/1.5 Onest,"Segoe UI",system-ui,sans-serif;display:flex;flex-direction:column}
body.dark{background:var(--night);color:#fff}button{font:inherit;color:inherit;cursor:pointer}:focus-visible{outline:3px solid var(--leaf);outline-offset:3px}.dark :focus-visible{outline-color:#fff}h1:focus,h2:focus{outline:0}
.w{width:100%;max-width:820px;margin:0 auto;padding:0 22px}main{flex:1;padding:44px 0 36px}
.top{padding-top:20px}.bar{display:flex;gap:6px}.bar i{height:5px;flex:1;border-radius:3px;background:#d5cfbe}.bar i.on{background:var(--leaf)}.dark .bar i{background:#33483c}.dark .bar i.on{background:var(--lime)}
h1,h2{line-height:1.13;letter-spacing:-.02em;font-weight:600;margin:0;text-wrap:balance}h1{font-size:clamp(36px,7vw,60px)}h2{font-size:clamp(28px,5vw,42px)}
em{font-family:"Cormorant Garamond",Georgia,serif;font-style:italic;font-weight:600;font-size:1.1em;color:var(--leaf)}.dark em{color:var(--lime)}
p{margin:0}.lead{margin-top:18px;font-size:20px;color:var(--soft);max-width:660px}.dark .lead{color:#c3cdc6}.fine{font-size:15px;color:var(--soft);margin-top:16px}.dark .fine{color:#a9b5ad}
.card{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:28px;margin-top:28px;color:var(--ink)}
.hint{font-size:15px;color:var(--soft);margin-bottom:12px}.opts{display:flex;flex-wrap:wrap;gap:8px}.opts button{border:1px solid #c4bda9;background:#fff;border-radius:10px;padding:11px 18px}.opts [aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:#fff}
.ch{display:block;width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:12px;padding:14px 16px;margin-bottom:8px}.ch[aria-pressed=true]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}.ch>span{display:flex;justify-content:space-between;gap:12px}.ch b{font-weight:500}.ch u{display:block;height:8px;border-radius:4px;background:#e9e4d6;margin-top:9px;overflow:hidden}.ch u i{display:block;height:100%;background:var(--leaf)}.ch u i.r{background:var(--red)}
.ans{border-radius:12px;padding:18px 20px;margin-top:18px;background:var(--grbg)}.ans.r{background:var(--redbg)}.ans.y{background:var(--ambg)}.ans b{display:block;font-size:22px;font-weight:600;line-height:1.25;margin-bottom:6px}
.eq{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:24px}.eq small{display:block;color:var(--soft);font-size:15px}.eq b{font-size:27px;font-weight:600;white-space:nowrap}
.ln{display:flex;justify-content:space-between;gap:16px;padding:12px 0;border-bottom:1px solid var(--line)}.ln span:last-child{white-space:nowrap}.ln.t{font-weight:600;border:0}
.q{padding:18px 0;border-top:1px solid var(--line)}.q:first-child{border:0;padding-top:0}.q p{margin-bottom:10px}.q .opts button{padding:8px 15px;font-size:16px}.q [data-v="0"][aria-pressed=true]{background:var(--red);border-color:var(--red)}.q [data-v="1"][aria-pressed=true]{background:var(--am);border-color:var(--am)}.q [data-v="2"][aria-pressed=true]{background:var(--gr);border-color:var(--gr)}
.st{display:grid;grid-template-columns:120px 1fr;gap:6px 20px;padding:16px 0;border-top:1px solid var(--line)}.st:first-child{border:0;padding-top:0}.st b{font-weight:600;color:var(--leaf)}
.price{font-size:44px;font-weight:600;letter-spacing:-.02em;line-height:1.1}.card p+p{margin-top:12px}a{color:var(--leaf);font-weight:600}
footer{padding:0 0 34px}footer .w{display:flex;gap:12px;align-items:center}.go{border:0;background:var(--night);color:#fff;border-radius:12px;padding:15px 28px;font-weight:600}.dark .go{background:var(--lime);color:var(--night)}.bk{border:0;background:none;padding:15px 12px;color:var(--soft)}
@media(max-width:600px){main{padding:30px 0 26px}.card{padding:20px}.eq{grid-template-columns:1fr;gap:10px}.eq div{display:flex;justify-content:space-between;align-items:baseline}.eq b{font-size:22px}.st{grid-template-columns:1fr}.lead{font-size:18px}.go{flex:1}.q .opts button{flex:1;padding:9px 6px;font-size:15px;white-space:nowrap}}

.w.wide{max-width:1140px}.ap{background:#fff;border:1px solid #cfc9b8;border-radius:10px;margin-top:24px;overflow:hidden;font-size:15px;color:var(--ink);box-shadow:0 14px 40px rgba(20,36,27,.09)}.ap>header{background:var(--night);color:#fff;padding:13px 18px;display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 18px}.ap>header span{color:#b7c4bb}.ap h3{margin:0;font-size:19px;font-weight:600}.ap small{display:block;color:var(--soft);font-size:13px;font-weight:400}
.two{display:grid;grid-template-columns:1fr 340px}.two aside{border-left:1px solid var(--line);background:#faf8f2;padding:18px}.sc{overflow-x:auto}.tb{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}.tb th{font-weight:500;font-size:13px;color:var(--soft);text-align:right;padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:bottom}.tb td{text-align:right;padding:10px 12px;border-bottom:1px solid #ebe7db;white-space:nowrap}.tb th:first-child,.tb td:first-child{text-align:left;padding-left:18px}.tb td button{border:0;background:none;padding:0;text-align:left;font-weight:500}.tb tr.on td{background:#eef4e4}.tb tfoot td{border:0;font-weight:600}.tb td b{font-weight:600}.bad{color:var(--red)!important}.mid{color:var(--am)}.good{color:var(--gr)}
.sm{font-size:14px;color:var(--soft)}.sm.h{margin:18px 0 8px;font-weight:500;color:var(--ink)}.l{display:flex;justify-content:space-between;padding:5px 0;font-variant-numeric:tabular-nums}.l.s{border-top:1px solid var(--ink);font-weight:600;margin-top:4px;padding-top:8px;font-size:17px}#po{margin-top:12px}.vd{border-radius:8px;padding:12px 14px;margin-top:12px;background:#eceade}.vd b{display:block;font-weight:600}.vd.g{background:var(--grbg)}.vd.r{background:var(--redbg)}.vd.y{background:var(--ambg)}.vd small{margin-top:6px}.ap label{display:block;margin-top:10px;font-size:14px}.ap label.ck{display:flex;gap:9px;align-items:center}.ap input[type=range]{display:block;width:100%;height:26px;accent-color:var(--leaf)}.ap input[type=checkbox]{width:18px;height:18px;accent-color:var(--leaf)}.ap input[type=number]{width:82px;font:inherit;text-align:right;padding:6px 8px;border:1px solid #c4bda9;border-radius:6px}
.seg{display:flex;padding:14px 18px 4px}.seg button{border:1px solid #c4bda9;background:#fff;padding:8px 16px}.seg button:first-child{border-radius:7px 0 0 7px}.seg button:last-child{border-radius:0 7px 7px 0;border-left:0}.seg [aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}.sum{display:grid;grid-template-columns:repeat(3,1fr);background:#faf8f2}.sum div{padding:18px;border-left:1px solid var(--line)}.sum div:first-child{border:0}.sum b{display:block;font-size:28px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}.sum span{font-size:14px;color:var(--soft)}.sum span.good{color:var(--gr);font-weight:600}
.kpw{display:grid;grid-template-columns:300px 1fr}.kpw aside{padding:4px 18px 18px;border-right:1px solid var(--line);background:#faf8f2}.lead1{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:8px;padding:11px 13px;margin-bottom:8px}.lead1[aria-pressed=true]{border-color:var(--ink);box-shadow:inset 3px 0 0 var(--leaf)}.lead1 b{font-weight:600}.lead1 .why{color:var(--leaf);margin-top:4px}.doc{padding:34px 40px;background:#fffdf8}.dh{display:flex;justify-content:space-between;gap:16px;border-bottom:1px solid var(--ink);padding-bottom:12px;font-size:14px}.dh span:first-child{letter-spacing:.2em;font-weight:600}.doc h3{font-family:"Cormorant Garamond",Georgia,serif;font-size:36px;line-height:1.1;margin:26px 0 12px;font-style:italic}.doc>p{max-width:560px}.it{display:grid;grid-template-columns:74px 1fr auto 110px;gap:16px;align-items:center;border-bottom:1px solid var(--line);padding:12px 0;font-variant-numeric:tabular-nums}.it:first-of-type{margin-top:12px}.it svg{width:74px;height:74px;background:#efeadd;padding:9px;fill:none;stroke:var(--ink);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}.it b,.it strong{font-weight:600}.it strong{text-align:right}.it.tt{display:flex;justify-content:space-between;font-size:19px;border:0;padding:16px 0}
@media(max-width:820px){.two,.kpw,.sum{grid-template-columns:1fr}.two aside,.kpw aside{border:0;border-top:1px solid var(--line)}.sum div{border:0;border-top:1px solid var(--line)}.tb .x{display:none}.tb td,.tb th{padding:9px 8px;white-space:normal}.doc{padding:24px 18px}.it{grid-template-columns:54px 1fr auto}.it svg{width:54px;height:54px}.it>span:nth-child(3){grid-column:2;font-size:14px;color:var(--soft)}.it>strong{grid-column:3;grid-row:1}.dh{flex-direction:column;gap:2px}.seg button{flex:1;padding:9px 6px}}
.tt2{width:100%;border-collapse:collapse;font-size:16px}.tt2 th,.tt2 td{padding:11px 10px;border-bottom:1px solid var(--line);text-align:center}.tt2 th{font-weight:500}.tt2 th b{font-size:19px;font-weight:600;white-space:nowrap}.tt2 td:first-child{text-align:left;padding-left:0}.tt2 th:last-child,.tt2 td:last-child{background:#eef4e4;font-weight:600}@media(max-width:600px){.tt2{font-size:14px}.tt2 th,.tt2 td{padding:9px 6px}.tt2 th b{font-size:15px}}
</style></head><body><div class="w top"><div class="bar" id="bar" aria-hidden="true"></div></div><main><div class="w" id="app"></div></main><footer><div class="w"><button class="go" id="go"></button><button class="bk" id="bk">Назад</button></div></footer>
<script>
const $=s=>document.querySelector(s),f=0;
let cur=0;const A={};
/* три рабочих экрана; вставляются в index.html при сборке */
const R0=n=>Math.round(n)||0,F=n=>R0(n).toLocaleString('ru-RU').replace('-','−'),sg=n=>(n>0?'+':'')+F(n),el=s=>document.querySelector(s);
/* 1. Партнёры, тыс. ₽: имя, тип, прайс, скидка, себестоимость, доставка, бой и возвраты, просрочено */
const PR=[['Дом и Свет','сеть, 14 магазинов',2600,27,1560,214,148,640],['Подарки и Ко','корпоративные подарки',1200,20,720,58,30,0],['Отель «Берег»','гостиница, 62 номера',900,15,540,46,9,0],['Интерьер Маркет','сеть, 5 магазинов',1000,25,600,84,52,180],['Студия «Мера»','дизайн-студия',760,12.5,456,18,12,0],['Галерея 12','салон',400,10,240,14,6,0]];
let ps=0;const W=PR.map(p=>({d:p[3],dl:false,ls:false,v:0}));
const calc=(p,w)=>{const k=1-w.v/100,r=p[2]*(1-w.d/100)*k,c=p[4]*k,dl=w.dl?0:p[5]*k,ls=w.ls?0:p[6]*k;return{r,c,dl,ls,m:r-c-dl-ls}};
const base=p=>calc(p,{d:p[3],v:0});
function app1(){const tot=PR.reduce((a,p,i)=>a+calc(p,W[i]).m,0),b0=PR.reduce((a,p)=>a+base(p).m,0);
return `<div class="ap"><header><b>Опт: что осталось от выручки</b><span>сентябрь – ноябрь, тыс. ₽</span></header><div class="two"><div class="sc"><table class="tb"><thead><tr><th>Партнёр</th><th>Выручка</th><th class="x">Скидка</th><th class="x">Доставка, бой</th><th>Осталось</th></tr></thead><tbody id="pr"></tbody><tfoot><tr><td>Всего по опту</td><td id="tr"></td><td class="x"></td><td class="x"></td><td id="tm"></td></tr></tfoot></table></div><aside id="pd"></aside></div></div>`}
function pRows(){let tr=0,tm=0;el('#pr').innerHTML=PR.map((p,i)=>{const c=calc(p,W[i]);tr+=c.r;tm+=c.m;return `<tr class="${i===ps?'on':''}"><td><button data-pp="${i}" aria-pressed="${i===ps}">${p[0]}<small>${p[1]}</small></button></td><td>${F(c.r)}</td><td class="x">${String(W[i].d).replace('.',',')}%</td><td class="x">${F(c.dl+c.ls)}</td><td class="${c.m<0?'bad':c.m/c.r<.05?'mid':''}"><b>${F(c.m)}</b></td></tr>`}).join('');el('#tr').textContent=F(tr);el('#tm').innerHTML='<b>'+F(tm)+'</b>';
document.querySelectorAll('[data-pp]').forEach(b=>b.onclick=()=>{ps=+b.dataset.pp;pRows();pCard();el(`[data-pp="${ps}"]`).focus()})}
function pOut(){const p=PR[ps],w=W[ps],c=calc(p,w),b=base(p),df=R0(c.m)-R0(b.m);
el('#po').innerHTML=[['Выручка',c.r],['Себестоимость',-c.c],['Доставка',0-c.dl],['Бой и возвраты',0-c.ls]].map(x=>`<div class="l"><span>${x[0]}</span><span>${F(x[1])}</span></div>`).join('')+`<div class="l s ${c.m<0?'bad':''}"><span>Осталось</span><span>${F(c.m)}</span></div>`;
el('#pv').innerHTML=df===0?(c.m<0?'<b>Первый по выручке партнёр работает в минус.</b> По выручке этого не видно.':c.m/c.r<.05?'<b>Почти ноль.</b> Одна неудачная поставка, и партнёр уйдёт в минус.':'<b>Партнёр зарабатывает.</b> '+F(c.m/c.r*100)+'% от его выручки остаётся компании.'):`<b>${sg(df)} тыс. ₽ за квартал</b> к текущим условиям.${w.v&&c.m>b.m?' Даже если заказов станет на '+w.v+'% меньше.':''}`;
el('#pv').className='vd '+(df>0?'g':c.m<0||df<0?'r':'')}
function pCard(){const p=PR[ps],w=W[ps];el('#pd').innerHTML=`<h3>${p[0]}</h3>${p[7]?`<p class="sm bad">Просрочено ${F(p[7])} тыс. ₽</p>`:'<p class="sm">Просрочки нет</p>'}<div id="po"></div><div class="vd" id="pv" aria-live="polite"></div><p class="sm h">Что предложить на переговорах</p><label>Скидка <b id="dl1"></b><input type="range" id="r1" min="0" max="30" step=".5" value="${w.d}"></label><label class="ck"><input type="checkbox" id="c1" ${w.dl?'checked':''}>Доставку оплачивает партнёр</label><label class="ck"><input type="checkbox" id="c2" ${w.ls?'checked':''}>Бой в пути за счёт перевозчика</label><label>Если закажет меньше на <b id="dl2"></b><input type="range" id="r2" min="0" max="50" step="5" value="${w.v}"></label>`;
const up=()=>{w.d=+el('#r1').value;w.dl=el('#c1').checked;w.ls=el('#c2').checked;w.v=+el('#r2').value;el('#dl1').textContent=String(w.d).replace('.',',')+'%';el('#dl2').textContent=w.v+'%';pRows();pOut()};['r1','c1','c2','r2'].forEach(i=>el('#'+i).oninput=up);up()}
/* 2. План производства: имя, остаток, бронь, продаж в день, дней на выпуск, себестоимость, прибыль с единицы, заявка цеха, по спросу */
const SK2=[['Ваза «Линия»',210,140,9,9,2150,3050,100,263],['Набор «Тихий дом»',22,45,4,14,2600,3300,0,171],['Подсвечник «Дуга»',64,80,7,7,780,1120,0,240],['Светильник «Арка»',46,30,1.6,18,9660,5140,60,0],['Скульптура «Форма»',88,12,.9,21,5200,6300,30,0],['Кашпо «Грань»',340,20,2.1,10,1400,1500,150,0]];
let qt=SK2.map(s=>s[7]),mode=0;const LIM=1200000,need=s=>Math.max(0,Math.ceil(s[2]+s[3]*37-s[1])),day=n=>{const d=new Date(2026,10,24+n);return d.getDate()+' '+['ноя','дек','янв'][d.getMonth()===10?0:d.getMonth()===11?1:2]};
const plan=q=>{let sp=0,pf=0,ex=0;SK2.forEach((s,i)=>{const n=Math.min(q[i],need(s));sp+=q[i]*s[5];pf+=n*s[6];ex+=(q[i]-n)*s[5]});return{sp,pf,ex}};
function app2(){return `<div class="ap"><header><b>Что запускать в производство до Нового года</b><span>24 ноября · бюджет на материалы и работу 1 200 000 ₽</span></header><div class="seg"><button data-md="0">Заявка цеха</button><button data-md="1">По спросу и броням</button></div><div class="sc"><table class="tb"><thead><tr><th>Изделие</th><th>Свободно</th><th class="x">Хватит до</th><th class="x">Не хватит до 31.12</th><th class="x">Готово, если начать сегодня</th><th>Запустить, шт.</th></tr></thead><tbody id="sk"></tbody></table></div><div class="sum" id="ss" aria-live="polite"></div></div>`}
function sSum(){const a=plan(qt),c=plan(SK2.map(s=>s[7])),ov=a.sp>LIM,diff=a.pf-c.pf;
el('#ss').innerHTML=`<div><small>Потратим</small><b class="${ov?'bad':''}">${F(a.sp)} ₽</b><span>${ov?'сверх бюджета '+F(a.sp-LIM):'останется '+F(LIM-a.sp)} ₽</span></div><div><small>Заработаем на декабрьском спросе</small><b>${F(a.pf)} ₽</b><span class="${diff>0?'good':''}">${diff?sg(diff)+' ₽ к заявке цеха':'заявка цеха'}</span></div><div><small>Осядет на складе</small><b class="${a.ex?'bad':''}">${F(a.ex)} ₽</b><span>${a.ex?'выпустим больше, чем успеем продать':'лишнего не выпускаем'}</span></div>`;
document.querySelectorAll('[data-md]').forEach(b=>b.setAttribute('aria-pressed',+b.dataset.md===mode))}
function sRows(){el('#sk').innerHTML=SK2.map((s,i)=>{const fr=s[1]-s[2],n=need(s);return `<tr><td>${s[0]}<small>на складе ${s[1]}, забронировано ${s[2]}</small></td><td class="${fr<0?'bad':''}">${F(fr)}</td><td class="x ${fr<0?'bad':''}">${fr<0?'уже мало':fr/s[3]>37?'января':day(Math.floor(fr/s[3]))}</td><td class="x">${n?n:'хватает'}</td><td class="x">${day(s[4])}</td><td><input type="number" min="0" max="999" inputmode="numeric" data-sq="${i}" value="${qt[i]}" aria-label="Запустить: ${s[0]}"></td></tr>`}).join('');
document.querySelectorAll('[data-sq]').forEach(x=>x.oninput=()=>{qt[x.dataset.sq]=Math.max(0,Math.min(999,+x.value||0));mode=-1;sSum()});sSum()}
