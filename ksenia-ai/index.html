.m small{display:block;color:var(--soft);font-size:13px}.m.l0 b{color:var(--red)}
.calc{display:flex;flex-wrap:wrap;gap:14px 22px;align-items:end;margin-bottom:4px}.calc label{font-size:15px}.calc input{display:block;width:110px;font:inherit;padding:8px 10px;border:1px solid #bfc7cf;border-radius:8px;margin-top:4px}.calc output{font-size:21px;font-weight:700;color:var(--teal)}

<script>
/* k навык, d что это на её данных, t задача, l уроки, r что останется, g почему приёма из гайда мало */
const SK=[
{id:'a',p:1,k:'Собрать отчёт так, чтобы не потерялась ни одна строка',d:'4 812 строк, свои названия статей, артикулы площадки и 1С не совпадают',t:'Отчёты площадок',l:'4-2, 2-8',r:'Порядок подготовки, который подходит к следующему отчёту',g:'В гайде файл уже удобный. У вас меняются колонки и артикулы, и нужно понять, на каком шаге пропали строки.'},
{id:'b',p:1,k:'Найти причину разницы по документам',d:'Отчёт, детализация удержаний и выписка сопоставлены, у каждой суммы есть строка',t:'Выплата меньше отчёта',l:'4-1, 2-9',r:'Таблица, где видно, за что удержали',g:'Готовый приём рассчитан на один источник. У вас их несколько, и связать их нужно по вашим признакам.'},
{id:'c',p:1,k:'Повторить разбор у другого клиента',d:'Тот же порядок, другой ИП и другой отчёт',t:'Отчёты всех клиентов',l:'1-9, 3-6',r:'Записанный порядок вместо работы с нуля',g:'Разовый ответ в чате к следующему клиенту не переносится. Нужна последовательность шагов с проверкой.'},
{id:'d',p:1,k:'Поймать уверенный, но неверный ответ',d:'Нейросеть взяла в доход выплату вместо продаж',t:'Всё, что идёт в учёт',l:'1-5, 2-7',r:'Порядок проверки до занесения в 1С',g:'На чужом примере ответ известен заранее. На ваших данных ошибку надо распознать самой, и показать её некому.'},
{id:'e',p:2,k:'Отличить расхождение от разной записи',d:'205 и 0000205 это один документ, а 24 000 и 21 000 ошибка',t:'Сверка с контрагентом',l:'4-1, 4-2',r:'Список документов, которые действительно разошлись',g:'Совет «сравни две таблицы» даёт десятки ложных отличий. Правила совпадения зависят от ваших баз.'},
{id:'f',p:2,k:'Превратить свой опыт в правила проверки',d:'Повторы, незачтённые авансы, минус на складе',t:'Контроль базы до сдачи',l:'1-9, 3-6',r:'Контрольный список по каждой базе',g:'Чужой чек-лист не знает, какие ошибки повторяются у ваших клиентов. Записать их можете только вы.'},
{id:'g',p:2,k:'Убрать данные клиентов до загрузки',d:'Названия, ИНН, договоры и счета чужие, отвечаете за них вы',t:'Работа с базами клиентов',l:'1-4',r:'Понимание, что и в каком виде можно загружать',g:'Общее «не загружайте лишнее» не отвечает, что оставить в файле, чтобы сверка всё ещё получилась.'},
{id:'h',p:2,k:'Подготовить запрос по найденному',d:'Каких документов не хватает, от кого и на какую сумму',t:'Запросы клиентам',l:'3-4, 3-2',r:'Шаблоны запросов и пояснений',g:'Шаблон письма найти легко. Сложнее собрать его из результата сверки, чтобы суммы и документы совпали.'}];
const ROWS={1:[
['Артикул 48-117, 12 строк','18 600,00','в 1С пары нет, вопрос клиенту','a','строки выпадут из итога незаметно'],
['Продвижение','2 100,00','есть в детализации, нет в отчёте','b','останется догадка про комиссию банка'],
['Логистика','1 400,00','корректировка прошлого отчёта','b','искать в старых отчётах вручную'],
['Доход ИП на УСН','314 300,00','продажи минус возвраты, а не выплата','d','в учёт может попасть выплата 211 150,00'],
['Отчёт другого клиента','3 264 строки','порядок тот же, к разбору 6 строк','c','снова с первой строки']],
2:[
['Накладная 205 и 0000205','80 000,00','совпало, разная запись номера','e','ложное расхождение, проверять глазами'],
['Накладная 209','3 000,00','в акте 24 000, в 1С 21 000','e','номера совпали, сумму можно пропустить'],
['П/п 640, второе списание','5 000,00','повтор внутри 1С','f','повтор посчитается совпавшим'],
['Накладная 214','35 640,00','нет в 1С, запрос оригинала готов','h','письмо и суммы собирать вручную'],
['Данные клиента','ИНН, договоры','заменены на условные до загрузки','g','загружать файл рискованно']]};
const SH=['Начало','Отчёты площадок','Расхождения в 1С','Чего не хватает','Почему не гайды','Что советую'],$=s=>document.querySelector(s);
const KEY='ksenia-ai-1';let A={},cur=0,calc=['',''];try{A=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}
const by=v=>SK.filter(s=>A[s.id]===v),lv=id=>A[id]==null?'':'l'+A[id],pl=(n,a,b,c)=>n%10==1&&n%100!=11?a:n%10>1&&n%10<5&&(n%100<10||n%100>20)?b:c;
function nav(){const n=by(0).length;$('#nav').innerHTML=SH.map((t,i)=>`<button type="button" data-go="${i}" ${i===cur?'aria-current="step"':''}>${t}</button>`).join('')+(n?`<span class="cnt">не хватает: ${n}</span>`:'');$('#nav').querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(+b.dataset.go))}
function go(i){cur=i;draw();scrollTo(0,0);const h=$('#app h1,#app h2');if(h){h.tabIndex=-1;h.focus({preventScroll:true})}const c=$('#nav [aria-current]');if(c&&c.scrollIntoView)c.scrollIntoView({inline:'center',block:'nearest'})}
const next=t=>`<button type="button" class="go" data-next>${t}</button>`;
function table(p){const rs=ROWS[p],hand=rs.filter(r=>A[r[3]]===0).length,ch=rs.filter(r=>A[r[3]]===1).length,any=rs.some(r=>A[r[3]]!=null);
 return `<header><span>${p===1?'ИП Соколова А. В., отчёт площадки, 4 812 строк':'ООО «Север» и ООО «Вектор», разница 43 640,00'}</span><b>${any?`останется вручную ${hand} из 5${ch?', перепроверять '+ch:''}`:'готовый результат'}</b></header>`+rs.map(r=>{const v=A[r[3]];return `<div class="r ${lv(r[3])}"><span>${r[0]}</span><span class="n">${r[1]}</span><span class="s">${v===0?r[4]:v===1?r[2]+', перепроверить':r[2]}</span></div>`}).join('')}
function task(p){const T=p===1?['Отчёты площадок','Объяснить выплату <em>и не потерять строки</em>','Клиент спрашивает, почему пришло меньше. Ответ лежит в другом отчёте или в детализации удержаний, а следующий клиент уже прислал свой файл.']:['Расхождения в 1С','Найти, <em>на каком документе разошлись</em>','Номера записаны по-разному, платёж задвоен, накладной нет. Причин несколько, и часть из них прячется за совпавшими номерами.'];
 return `<section><div class="w"><p class="eb">Задача ${p} из 2</p><h2>${T[1]}</h2><p class="say">${T[2]}</p><div class="tb" id="tb" aria-live="polite">${table(p)}</div>
 <h3>Что вы уже делаете с нейросетью сами?</h3><p class="fine">Отвечайте как есть. Таблица выше изменится и покажет, что пока останется на вас.</p><div id="sks">${SK.filter(s=>s.p===p).map(s=>`<div class="sk ${lv(s.id)}" data-s="${s.id}"><div><b>${s.k}</b><p>${s.d}</p></div><div class="seg" role="group" aria-label="${s.k}">${['Пока нет','Пробовала','Уже делаю'].map((t,v)=>`<button type="button" data-v="${v}" aria-pressed="${A[s.id]===v}">${t}</button>`).join('')}</div></div>`).join('')}</div>${next(p===1?'К расхождениям в 1С':'Посмотреть, чего не хватает')}<p class="fine">Организации и суммы условные. Решение всегда остаётся за вами.</p></div></section>`}
function draw(){nav();const n=by(0).length,m=by(1).length,done=SK.filter(s=>A[s.id]!=null).length,need=[...by(0),...by(1)],sorted=[...need,...SK.filter(s=>A[s.id]==null),...by(2)];let h='';
 if(cur===0)h=`<section class="dark"><div class="w"><p class="eb">AI-навыки финансиста, для Ксении</p><h1>Площадка перевела меньше, <em>а объяснять вам</em></h1><p class="lead">Ксения, вы назвали две задачи, которые отнимают больше всего времени: отчёты маркетплейсов и расхождения в базе 1С. Посмотрим на цифрах, что можно отдать нейросети и каких навыков для этого пока не хватает.</p>
 <div class="tb"><header><span>ИП Соколова А. В., отчёт и выплата</span><b>причина найдена</b></header>${[['По отчёту площадки','214 650,00'],['Пришло на счёт','211 150,00'],['Не хватает','3 500,00','bad'],['Продвижение, по детализации удержаний','2 100,00'],['Логистика, корректировка прошлого отчёта','1 400,00'],['Объяснено документами','3 500,00','tot']].map(r=>`<div class="r two ${r[2]||''}"><span>${r[0]}</span><span class="n">${r[1]}</span></div>`).join('')}</div>${next('Разобрать на моих задачах')}<p class="fine">Организации и суммы условные. Подготовила Александра, «Мастер CFO»</p></div></section>`;
 if(cur===1||cur===2)h=task(cur);
 if(cur===3)h=`<section><div class="w"><p class="eb">Ваша карта навыков</p>${n?`<div class="big"><b>${n}</b><h2>${pl(n,'навыка','навыков','навыков')} из ${SK.length} пока не хватает${m?`, ещё ${m} <em>без уверенности</em>`:''}</h2></div>`:done<SK.length?`<h2>Отметьте навыки на <em>двух задачах</em></h2>`:m?`<h2>${m} из ${SK.length} навыков пока <em>без уверенности</em></h2>`:`<h2>Эти задачи у вас <em>уже налажены</em></h2>`}
 <div class="dots" aria-hidden="true">${sorted.map(s=>`<i class="${lv(s.id)}"></i>`).join('')}</div>${done<SK.length?`<p class="fine">Без ответа: ${SK.length-done}.</p>`:''}
 ${sorted.map(s=>`<div class="m ${lv(s.id)}"><div><b>${s.k}</b></div><div><small>${s.t}</small>Уроки ${s.l}</div><div><small>Что останется у вас</small>${s.r}</div></div>`).join('')}
 <div class="note"><h3>Сколько это стоит вам сейчас</h3><div class="calc"><label>Отчётов и сверок в месяц<input id="c0" type="number" min="0" max="500" inputmode="numeric" value="${calc[0]}"></label><label>Минут на одну<input id="c1" type="number" min="0" max="600" inputmode="numeric" value="${calc[1]}"></label><output id="co" aria-live="polite"></output></div></div>
 ${next('Хватит ли бесплатных материалов')}</div></section>`;
 if(cur===4)h=`<section><div class="w"><p class="eb">Гайды, эфиры, бесплатные нейросети</p><h2>Они знакомят с приёмом. <em>Дальше начинаются ваши данные</em></h2><p class="say">Вы уже обрабатываете данные из 1С и внешних источников в бесплатных нейросетях. И всё же отчёты и расхождения по-прежнему занимают больше всего времени. Обычно останавливает следующее:</p>
 ${need.length?need.map(s=>`<div class="sk ${lv(s.id)}" style="grid-template-columns:1fr"><div><b>${s.k}</b><p>${s.g}</p></div></div>`).join(''):`<p>${done<SK.length?'Отметьте навыки на страницах задач, и здесь появится только то, что относится к вам.':'По этим задачам пробелов вы не отметили.'}</p>`}
 ${need.length>1?`<div class="note"><b>Эти навыки работают вместе.</b> Если отчёт собран с потерей строк, точный поиск причины уже не поможет. Если нет проверки, неверная сумма уйдёт в учёт. На обучении вы собираете всю цепочку на своей задаче, а куратор помогает там, где не сходится.</div>`:''}${next('Что советую')}</div></section>`;
 if(cur===5)h=`<section><div class="w"><p class="eb">Итог</p><h2>Что вы получите и <em>какой тариф советую</em></h2><div class="tb"><div style="padding:16px"><ul>${(need.length?need:SK).map(s=>`<li>${s.r} <span class="fine">(${s.l})</span></li>`).join('')}</ul></div></div>
